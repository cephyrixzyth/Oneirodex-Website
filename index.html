<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oneirodex</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --accent: #a855f7;
            --muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        h1 {
            color: var(--accent);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: var(--muted);
        }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 1rem;
        }
        .grid {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }
        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card h3 {
            margin-top: 0;
            color: var(--accent);
        }
        footer {
            margin-top: 4rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1 id="repo-name">Oneirodex</h1>
        <p class="subtitle" id="repo-desc">Loading repository details...</p>
        <a id="repo-link" href="https://github.com/chrisjrovira/Oneirodex" class="btn">View on GitHub</a>
    </header>

    <main class="grid">
        <div class="card">
            <h3>About</h3>
            <p id="about-text">Explore the index of dreams and surreal phenomena.</p>
        </div>
        <div class="card">
            <h3>Quick Stats</h3>
            <p><strong>Stars:</strong> <span id="stars">-</span></p>
            <p><strong>Forks:</strong> <span id="forks">-</span></p>
            <p><strong>Open Issues:</strong> <span id="issues">-</span></p>
        </div>
    </main>

    <footer>
        <p>Maintained by <a href="https://github.com/chrisjrovira" style="color: var(--accent);">chrisjrovira</a></p>
    </footer>

    <script>
        // Fetches repo details directly from GitHub API
        async function fetchRepoData() {
            try {
                const res = await fetch('https://api.github.com/repos/chrisjrovira/Oneirodex');
                const data = await res.json();
                
                if (data.description) {
                    document.getElementById('repo-desc').innerText = data.description;
                }
                document.getElementById('stars').innerText = data.stargazers_count;
                document.getElementById('forks').innerText = data.forks_count;
                document.getElementById('issues').innerText = data.open_issues_count;
            } catch (err) {
                document.getElementById('repo-desc').innerText = "A collection and index for dreams.";
            }
        }
        fetchRepoData();
    </script>
</body>
</html>
